# تشغيل على سيرفر (VPS) مع HTTPS تلقائي:  docker compose up -d --build
services:
  app:
    build: .
    restart: always
    env_file: .env
    volumes: [ "./data:/data" ]
  caddy:
    image: caddy:2
    restart: always
    ports: [ "80:80", "443:443" ]
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile", "caddy_data:/data" ]
    depends_on: [ app ]
volumes:
  caddy_data:
