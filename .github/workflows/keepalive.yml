name: keepalive
# Pings the store every ~5 minutes so the free Render instance does not go to sleep.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 https://bright-store.onrender.com/healthz
